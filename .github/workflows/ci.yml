name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # CI never talks to a live provider: every check runs on deterministic sample data.
  MARKET_DATA_PROVIDER: deterministic
  FX_DATA_PROVIDER: deterministic

jobs:
  static:
    name: Lint, knip, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SKIP_ENV_VALIDATION: "true"
      # Placeholders so module-level config (auth origin, DB client) can load during `next build`.
      # Nothing connects to this database and the secret signs nothing.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/investi_ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # PageProps/LayoutProps and route types live in .next/types; a clean checkout has none.
      - name: Generate Next.js route types
        run: npx next typegen
      - run: npm run lint
      - run: npm run knip
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Lesson content must stay out of client JS and the lesson route within its JS budget (#131).
      - run: npm run check:lesson-bundle

  persistence:
    name: Database, persistence and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d investi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service container; the suites refuse any non-loopback database.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/investi_ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:curriculum-seed
      - run: npm run test:curriculum-compatibility
        env:
          CURRICULUM_QA_DISPOSABLE: "1"
      - run: npm run db:check-curriculum
      - run: npm run test:migration
      - run: npm run test:portfolio-migration
      - run: npm run test:persistence
      - run: npm run test:portfolio-persistence
      - run: npm run test:portfolio-process
        env:
          PROCESS_QA_DISPOSABLE: "1"
      - run: npm run test:market-data-cache
      - run: npm run test:rate-limit
      - run: npm run test:account-recovery
      - run: npm run test:portfolio-allocation
      - run: npm run test:portfolio-closed-market
      - run: npm run test:progression-persistence
      - run: npm run test:log-returns-persistence
      - run: npm run test:guest-claim
      - name: Artifact migrations, versions and lifecycle
        run: |
          node --input-type=module -e 'import postgres from "postgres"; const sql = postgres(process.env.DATABASE_URL); await sql`CREATE DATABASE investi_artifacts_qa`; await sql.end();'
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/investi_artifacts_qa npm run test:artifacts-persistence
        env:
          ARTIFACTS_QA_DISPOSABLE: "1"
      - name: Goals lesson saved-output requirements
        run: DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/investi_artifacts_qa npm run test:goals-persistence
        env:
          ARTIFACTS_QA_DISPOSABLE: "1"
      - name: IPS history, target-only handoff and lifecycle
        run: DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/investi_artifacts_qa npm run test:ips-persistence
        env:
          IPS_QA_DISPOSABLE: "1"
      - name: Crisis training replay, idempotency and isolation
        run: npm run test:training-persistence
        env:
          TRAINING_QA_DISPOSABLE: "1"
      - name: Product funnel migration, early returns and landing views
        run: |
          node --input-type=module -e 'import postgres from "postgres"; const sql = postgres(process.env.DATABASE_URL); await sql`CREATE DATABASE investi_funnel_qa`; await sql.end();'
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/investi_funnel_qa npm run test:product-analytics
        env:
          FUNNEL_QA_DISPOSABLE: "1"
      # Deletes every session in the database that expired more than 30 days ago.
      - name: npm run test:account-deletion
        run: npm run test:account-deletion
        env:
          ACCOUNT_DATA_QA_DISPOSABLE: "1"
      # Last: it deletes every unreachable anonymous identity in the database.
      - name: npm run test:anonymous-cleanup
        run: npm run test:anonymous-cleanup
        env:
          ANONYMOUS_CLEANUP_QA_DISPOSABLE: "1"
