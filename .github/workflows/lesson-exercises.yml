name: Lesson exercises

on:
  pull_request:
    paths:
      - .github/workflows/lesson-exercises.yml
      - 'src/components/lesson/**'
      - 'src/features/lessons/**'
      - 'src/features/learning/**'
      - 'src/features/facts/**'
      - 'src/features/progress/**'
      - 'src/features/artifacts/**'
      - 'src/db/**'
      - 'drizzle/**'
      - 'scripts/validate-lesson-exercises*'
      - scripts/validate-lesson-walkthrough.mts
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson-exercises-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exercises:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investi_artifacts_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d investi_artifacts_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MARKET_DATA_PROVIDER: deterministic
      FX_DATA_PROVIDER: deterministic
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/investi_artifacts_qa
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere-0123456789
      BETTER_AUTH_URL: http://localhost:3131
      ARTIFACTS_QA_DISPOSABLE: '1'
      # Match the browser suites: ubuntu-latest already includes Google Chrome.
      BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:lesson-exercises-persistence
      - run: npm run test:lesson-exercises-browser
      # Every published lesson, answered wrong then right, at 1440/390/320 px with axe (#147). The probe compiles the lesson route.
      - name: Walk every published lesson
        run: .github/scripts/start-server.sh 3131 dev /learn/returns/what-is-a-return && npm run test:lesson-walkthrough
        env:
          WALKTHROUGH_TEST_URL: http://localhost:3131
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lesson-exercises-${{ github.run_id }}
          path: |
            test-results/lesson-exercises/
            test-results/lesson-walkthrough/
            next-*.log
          retention-days: 7
